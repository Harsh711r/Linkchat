<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Room - PeerLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        stone: {
                            500: '#78716c',
                            600: '#57534e',
                            700: '#44403c',
                            800: '#292524',
                            900: '#1c1917',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .code-input {
            letter-spacing: 0.5em;
            text-indent: 0.5em;
        }
        .spinner {
            border: 3px solid rgba(120, 113, 108, 0.3);
            border-radius: 50%;
            border-top: 3px solid #78716c;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-stone-800 p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i data-feather="send" class="text-stone-400"></i>
                <h1 class="text-xl font-bold">PeerLink</h1>
            </div>
            <button onclick="window.location.href='index.html'" class="flex items-center text-stone-300 hover:text-white">
                <i data-feather="home" class="mr-1"></i> Home
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto p-4">
        <div class="max-w-2xl mx-auto bg-stone-800 rounded-xl p-6 shadow-lg">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold mb-2">Join Existing Session</h2>
                <p class="text-stone-300">Connect to a P2P session using a room code</p>
            </div>

            <div class="mb-6">
                <label for="room-code-input" class="block text-stone-300 mb-2">Enter 6-digit room code</label>
                <div class="relative">
                    <input
                        type="text"
                        id="room-code-input"
                        maxlength="6"
                        pattern="\d{6}"
                        inputmode="numeric"
                        class="w-full code-input bg-stone-700 border border-stone-600 rounded-lg py-3 px-4 text-2xl font-mono text-center focus:outline-none focus:ring-2 focus:ring-stone-500 focus:border-transparent"
                        placeholder="000000"
                    >
                    <i data-feather="hash" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-stone-400"></i>
                </div>
                <p id="code-error" class="text-red-400 text-sm mt-1 hidden">Please enter a valid 6-digit code</p>
            </div>

            <div class="mb-6">
                <h3 class="text-xl font-semibold mb-3">Your Information</h3>
                <div class="mb-3">
                    <label for="username" class="block text-stone-300 mb-1">Display Name</label>
                    <input
                        type="text"
                        id="username"
                        class="w-full bg-stone-700 border border-stone-600 rounded-lg py-2 px-3 focus:outline-none focus:ring-2 focus:ring-stone-500 focus:border-transparent"
                        placeholder="Your name"
                        maxlength="20"
                    >
                </div>
            </div>

            <button id="join-session" class="w-full bg-stone-600 hover:bg-stone-500 text-white py-3 px-4 rounded-lg transition flex items-center justify-center font-semibold">
                <i data-feather="log-in" class="mr-2"></i> Join Session
            </button>

            <!-- Connection Status -->
            <div id="connection-status" class="mt-4 p-3 bg-stone-700 rounded-lg hidden">
                <div class="flex items-center">
                    <div class="spinner mr-3"></div>
                    <span id="status-text">Connecting to peer...</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        feather.replace();

        document.addEventListener('DOMContentLoaded', () => {
            const roomCodeInput = document.getElementById('room-code-input');
            const usernameInput = document.getElementById('username');
            const joinButton = document.getElementById('join-session');
            const codeError = document.getElementById('code-error');

            // Auto-advance between code digits
            roomCodeInput.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/\D/g, '');

                if (e.target.value.length === 6) {
                    codeError.classList.add('hidden');
                }
            });

            joinButton.addEventListener('click', async () => {
                const roomCode = roomCodeInput.value;
                const username = usernameInput.value.trim();

                if (roomCode.length !== 6) {
                    codeError.textContent = 'Please enter a valid 6-digit code';
                    codeError.classList.remove('hidden');
                    return;
                }

                if (!username) {
                    usernameInput.focus();
                    codeError.textContent = 'Please enter your display name';
                    codeError.classList.remove('hidden');
                    return;
                }

                // Direct redirect to session page.
                // Reliability improvements will be handled in session.html
                window.location.href = `session.html?room=${roomCode}&username=${encodeURIComponent(username)}&host=false`;
            });

            // Allow pressing Enter to join
            usernameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    joinButton.click();
                }
            });
            roomCodeInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    joinButton.click();
                }
            });
        });
    </script>
</body>
</html>
